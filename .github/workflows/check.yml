name: check

on:
  push:
  pull_request:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No install step: the checker is dependency-free by design, so CI runs
      # exactly what a contributor runs locally.
      - name: Drift and invariants
        run: node tools/check-sync.mjs
      - name: Contrast, both themes
        run: node tools/check-sync.mjs --contrast
      # --offline checks every local path and touches no network, so this can
      # never go red because a font CDN rate-limited the runner. Local paths are
      # where the risk actually is: a renamed screenshot or a moved doc.
      - name: Doc links resolve
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true
